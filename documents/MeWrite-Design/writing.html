<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HaqiZ — Writing</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <nav class="nav">
      <a href="index.html" class="nav__brand">HaqiZ</a>
      <div class="nav__links">
        <a href="index.html">Writings</a>
        <a href="desk.html">Desk</a>
      </div>
    </nav>

    <main>
      <div id="content"></div>
    </main>

    <footer class="footer">
      <span>HaqiZ</span>
      <span>© 2026</span>
    </footer>
  </div>

  <script src="js/app.js"></script>
  <script>
    (function() {
      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var writing = id ? App.getWriting(id) : null;
      var container = document.getElementById('content');
      var author = App.getAuthor();

      if (!writing || !writing.published) {
        container.innerHTML =
          '<div class="empty-state" style="padding:var(--space-20) 0;">' +
            '<div class="empty-state__title">Writing not found</div>' +
            '<p class="empty-state__text">This piece may have been moved or unpublished.</p>' +
            '<a href="index.html" class="btn btn--secondary">← Back to writings</a>' +
          '</div>';
        document.title = 'HaqiZ — Not found';
        return;
      }

      document.title = 'HaqiZ — ' + (writing.title || 'Untitled');

      var titleHtml = writing.title
        ? '<h1 class="writing-header__title">' + writing.title + '</h1>'
        : '<h1 class="writing-header__title" style="color:var(--muted);font-style:italic;">Untitled</h1>';

      container.innerHTML =
        '<div class="writing-header">' +
          '<div class="writing-header__date">' + App.formatDate(writing.date) + '</div>' +
          titleHtml +
          '<div class="writing-header__author">by ' + author.name + '</div>' +
        '</div>' +
        '<article class="writing-body prose">' +
          writing.content +
        '</article>' +
        '<div class="author-card">' +
          '<div class="author-card__avatar author-card__avatar--placeholder">' +
            (author.avatar
              ? '<img src="' + author.avatar + '" alt="' + author.name + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">'
              : author.name.charAt(0).toUpperCase()) +
          '</div>' +
          '<div class="author-card__info">' +
            '<div class="author-card__name">' + author.name + '</div>' +
            '<div class="author-card__bio">' + author.bio + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="margin-top:var(--space-12);">' +
          '<a href="index.html" class="link-underline" style="color:var(--muted);font-size:var(--text-sm);">← Back to writings</a>' +
        '</div>';
    })();
  </script>
</body>
</html>
